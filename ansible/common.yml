# Configurações comuns a todas as VMs
- name: Configurações Gerais (Todas as VMs)
  hosts: all
  become: yes
  tasks:
    - name: Descobrir o disco do sistema (raiz)
      shell: lsblk -no PKNAME "$(findmnt -n -o SOURCE /)" | head -1
      register: disco_raiz
      changed_when: false

    - name: Definir o dispositivo de instalação do GRUB (evita falha no upgrade)
      shell: echo "grub-pc grub-pc/install_devices multiselect /dev/{{ disco_raiz.stdout }}" | debconf-set-selections
      changed_when: false

    - name: Configurar timezone para America/Recife
      timezone:
        name: America/Recife

    - name: Instalar Chrony e Cliente NFS
      apt:
        name:
          - chrony
          - nfs-common
        state: present

    # Sincronização de horário com o pool brasileiro
    - name: Configurar Chrony com pool.ntp.br
      copy:
        dest: /etc/chrony/chrony.conf
        content: |
          pool pool.ntp.br iburst
          makestep 1 3
      notify: Restart Chrony

    - name: Criar grupo ifpb
      group:
        name: ifpb
        state: present

    - name: Criar usuários dos integrantes (membros do grupo ifpb)
      user:
        name: "{{ item }}"
        groups: ifpb
        append: yes
        shell: /bin/bash
      loop:
        - "{{ nome1 }}"
        - "{{ nome2 }}"

    # A chave pública vem de keys/<nome>.pub, gerada no controlador pelo chaves.yml.
    # exclusive: só essa chave fica autorizada (remove chaves antigas).
    - name: Autorizar a chave pública de cada usuário
      authorized_key:
        user: "{{ item }}"
        key: "{{ lookup('file', playbook_dir ~ '/../keys/' ~ item ~ '.pub') }}"
        exclusive: yes
      loop:
        - "{{ nome1 }}"
        - "{{ nome2 }}"

    - name: Permitir sudo sem senha para usuários do grupo ifpb
      copy:
        dest: /etc/sudoers.d/ifpb
        content: "%ifpb ALL=(ALL) NOPASSWD: ALL\n"
        mode: '0440'
        validate: 'visudo -cf %s'

    - name: Criar banner de boas-vindas do SSH
      copy:
        dest: /etc/ssh/banner
        content: "Acesso apenas para pessoas com autorização expressa!!!\n"

    # Segurança do servidor SSH
    - name: Ajustar configurações de segurança do SSH
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
        validate: '/usr/sbin/sshd -t -f %s'   # não grava um sshd_config inválido (evita perder o acesso)
      loop:
        - { regexp: '^#?PubkeyAuthentication', line: 'PubkeyAuthentication yes' }
        - { regexp: '^#?PasswordAuthentication', line: 'PasswordAuthentication no' }
        - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin no' }
        - { regexp: '^#?Banner', line: 'Banner /etc/ssh/banner' }
        - { regexp: '^#?AllowGroups', line: 'AllowGroups vagrant ifpb' }
      notify: Restart SSH

  handlers:
    - name: Restart Chrony
      service: name=chrony state=restarted
    - name: Restart SSH
      service: name=ssh state=restarted

