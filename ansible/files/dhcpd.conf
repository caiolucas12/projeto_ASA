authoritative;
default-lease-time 180;
max-lease-time 3600;
option domain-name "gabriel.caio.devops";
option domain-name-servers 192.168.56.135;

subnet 192.168.56.0 netmask 255.255.255.0 {
  range 192.168.56.50 192.168.56.100;
  option routers 192.168.56.1;
}

# Reserva do DB via MAC 08:00:27:00:00:02
host db {
  hardware ethernet 08:00:27:00:00:02;
  fixed-address 192.168.56.1YY; # Substitua YY pelos 2 últimos dígitos da matrícula do Caio
}

# Reserva do App via MAC 08:00:27:00:00:03
host app {
  hardware ethernet 08:00:27:00:00:03;
  fixed-address 192.168.56.1XY; # Substitua XY pelos dígitos definidos do grupo
}
