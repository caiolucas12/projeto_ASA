# Servidor de aplicação (Apache)
- name: Configurar Servidor de Aplicação (app)
  hosts: app
  become: yes
  tasks:
    - name: Instalar Apache2
      apt:
        name: apache2
        state: present

    - name: Criar página HTML customizada
      copy:
        dest: /var/www/html/index.html
        content: |
          <!DOCTYPE html>
          <html>
          <head><title>Projeto 01 - DevOps</title></head>
          <body>
            <h1>Projeto 01 - DevOps com Vagrant e Ansible</h1>
            <p><strong>Integrantes:</strong> Gabriel (Matrícula: 35), Caio (Matrícula: YY)</p>
          </body>
          </html>
