# Servidor de arquivos: DHCP, DNS (bind9), LVM e NFS
- name: Configurar Servidor de Arquivos (arq)
  hosts: arq
  become: yes
  tasks:
    - name: Instalar pacotes DHCP, Bind9 e NFS Server
      apt:
        name:
          - isc-dhcp-server
          - bind9
          - bind9utils
          - nfs-kernel-server
        state: present

    - name: Copiar arquivo de configuração do DHCP
      copy:
        src: files/dhcpd.conf
        dest: /etc/dhcp/dhcpd.conf
      notify: Restart DHCP

    - name: Definir interface do DHCP (eth1)
      lineinfile:
        path: /etc/default/isc-dhcp-server
        regexp: '^INTERFACESv4='
        line: 'INTERFACESv4="eth1"'
      notify: Restart DHCP

    # LVM: 3 discos adicionais em um volume group
    - name: Criar Volume Group (dados) com os 3 discos adicionais
      lvg:
        vg: dados
        pvs: /dev/sdb,/dev/sdc,/dev/sdd

    - name: Criar Logical Volume (ifpb) de 15GB
      lvol:
        vg: dados
        lv: ifpb
        size: 15g

    - name: Formatar o LV em ext4
      filesystem:
        fstype: ext4
        dev: /dev/dados/ifpb

    - name: Montar partição /dados no fstab
      mount:
        path: /dados
        src: /dev/dados/ifpb
        fstype: ext4
        state: mounted

    - name: Criar usuário nfs-ifpb sem shell de acesso
      user:
        name: nfs-ifpb
        shell: /usr/sbin/nologin
      register: nfs_user

    - name: Criar diretório /dados/nfs
      file:
        path: /dados/nfs
        state: directory
        owner: nfs-ifpb
        group: nfs-ifpb
        mode: '0755'

    - name: Configurar compartilhamento no /etc/exports
      lineinfile:
        path: /etc/exports
        line: "/dados/nfs 192.168.56.0/24(rw,sync,all_squash,anonuid={{ nfs_user.uid }},anongid={{ nfs_user.group }})"
      notify: Restart NFS

  handlers:
    - name: Restart DHCP
      service: name=isc-dhcp-server state=restarted
    - name: Restart NFS
      service: name=nfs-kernel-server state=restarted
