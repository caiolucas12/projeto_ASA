# Gera, no COMPUTADOR QUE RODA O ANSIBLE, um par de chaves ed25519 por integrante em keys/<nome>
# (raiz do projeto). As públicas vão para as VMs pelo common.yml; as privadas ficam só aqui e são
# usadas pelo script de verificação. Idempotente: não recria chaves existentes.
- name: Gerar chaves SSH dos integrantes (controlador)
  hosts: localhost
  connection: local
  gather_facts: no
  tasks:
    - name: Criar diretório keys/
      file:
        path: "{{ playbook_dir }}/../keys"
        state: directory
        mode: '0700'

    - name: Gerar par de chaves de cada integrante
      command:
        argv: [ssh-keygen, -q, -t, ed25519, -N, "", -C, "{{ item }}@{{ dominio }}", -f, "{{ playbook_dir }}/../keys/{{ item }}"]
        creates: "{{ playbook_dir }}/../keys/{{ item }}"
      loop: "{{ integrantes }}"
