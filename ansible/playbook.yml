- name: Configurações Gerais (Todas as VMs)
  hosts: all
  become: yes
  tasks:
    - name: Atualizar repositórios e pacotes do sistema
      apt:
        update_cache: yes
        upgrade: dist
      #[cite: 2]

    - name: Configurar timezone para America/Recife
      timezone:
        name: America/Recife
      #[cite: 2]

    - name: Instalar Chrony e Cliente NFS
      apt:
        name:
          - chrony
          - nfs-common
        state: present
      #[cite: 2]

    - name: Configurar Chrony com pool.ntp.br
      copy:
        dest: /etc/chrony/chrony.conf
        content: |
          pool pool.ntp.br iburst
          makestep 1 3
      notify: Restart Chrony
      #[cite: 2]

    - name: Criar grupo ifpb
      group:
        name: ifpb
        state: present
      #[cite: 2]

    - name: Criar usuários gabriel e caio
      user:
        name: "{{ item }}"
        groups: ifpb
        append: yes
        generate_ssh_key: yes
        shell: /bin/bash
      loop:
        - gabriel
        - caio
      #[cite: 2]

    - name: Permitir sudo sem senha para usuários do grupo ifpb
      copy:
        dest: /etc/sudoers.d/ifpb
        content: "%ifpb ALL=(ALL) NOPASSWD: ALL"
        mode: '0440'
      #[cite: 2]

    - name: Criar banner de boas-vindas do SSH
      copy:
        dest: /etc/ssh/banner
        content: "Acesso apenas para pessoas com autorização expressa!!!\n"
      #[cite: 2]

    - name: Ajustar configurações de segurança do SSH
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "{{ item.regexp }}"
        line: "{{ item.line }}"
      loop:
        - { regexp: '^#?PubkeyAuthentication', line: 'PubkeyAuthentication yes' }
        - { regexp: '^#?PermitRootLogin', line: 'PermitRootLogin no' }
        - { regexp: '^#?Banner', line: 'Banner /etc/ssh/banner' }
        - { regexp: '^#?AllowGroups', line: 'AllowGroups vagrant ifpb' }
      notify: Restart SSH
      #[cite: 2]

  handlers:
    - name: Restart Chrony
      service: name=chrony state=restarted
    - name: Restart SSH
      service: name=ssh state=restarted


- name: Configurar Servidor de Arquivos (arq)
  hosts: arq
  become: yes
  tasks:
    - name: Instalar pacotes DHCP, Bind9 e NFS Server
      apt:
        name:
          - isc-dhcp-server
          - bind9
          - bind9utils
          - nfs-kernel-server
        state: present
      #

    - name: Copiar arquivo de configuração do DHCP
      copy:
        src: files/dhcpd.conf
        dest: /etc/dhcp/dhcpd.conf
      notify: Restart DHCP
      #[cite: 3]

    - name: Definir interface do DHCP (eth1)
      lineinfile:
        path: /etc/default/isc-dhcp-server
        regexp: '^INTERFACESv4='
        line: 'INTERFACESv4="eth1"'
      notify: Restart DHCP
      #[cite: 3]

    - name: Criar Volume Group (dados) com os 3 discos adicionais
      lvg:
        vg: dados
        pvs: /dev/sdb,/dev/sdc,/dev/sdd
      #[cite: 3]

    - name: Criar Logical Volume (ifpb) de 15GB
      lvol:
        vg: dados
        lv: ifpb
        size: 15g
      #[cite: 3]

    - name: Formatar o LV em ext4
      filesystem:
        fstype: ext4
        dev: /dev/dados/ifpb
      #[cite: 3]

    - name: Montar partição /dados no fstab
      mount:
        path: /dados
        src: /dev/dados/ifpb
        fstype: ext4
        state: mounted
      #[cite: 3]

    - name: Criar usuário nfs-ifpb sem shell de acesso
      user:
        name: nfs-ifpb
        shell: /usr/sbin/nologin
      register: nfs_user
      #[cite: 3, 4]

    - name: Criar diretório /dados/nfs
      file:
        path: /dados/nfs
        state: directory
        owner: nfs-ifpb
        group: nfs-ifpb
        mode: '0755'
      #[cite: 3]

    - name: Configurar compartilhamento no /etc/exports
      lineinfile:
        path: /etc/exports
        line: "/dados/nfs 192.168.56.0/24(rw,sync,all_squash,anonuid={{ nfs_user.uid }},anongid={{ nfs_user.group }})"
      notify: Restart NFS
      #[cite: 3, 4]

  handlers:
    - name: Restart DHCP
      service: name=isc-dhcp-server state=restarted
    - name: Restart NFS
      service: name=nfs-kernel-server state=restarted


- name: Configurar Servidor de Banco de Dados (db)
  hosts: db
  become: yes
  tasks:
    - name: Instalar MariaDB
      apt:
        name: mariadb-server
        state: present
      #


- name: Configurar Servidor de Aplicação (app)
  hosts: app
  become: yes
  tasks:
    - name: Instalar Apache2
      apt:
        name: apache2
        state: present
      #

    - name: Criar página HTML customizada
      copy:
        dest: /var/www/html/index.html
        content: |
          <!DOCTYPE html>
          <html>
          <head><title>Projeto 01 - DevOps</title></head>
          <body>
            <h1>Projeto 01 - DevOps com Vagrant e Ansible</h1>
            <p><strong>Integrantes:</strong> Gabriel (Matrícula: 35), Caio (Matrícula: YY)</p>
          </body>
          </html>
      #[cite: 4]


- name: Configurar Host Cliente (cli)
  hosts: cli
  become: yes
  tasks:
    - name: Instalar pacotes Firefox e X11 Auth
      apt:
        name:
          - firefox-esr
          - xauth
        state: present
      #[cite: 4]

    - name: Habilitar X11 Forwarding no SSH
      lineinfile:
        path: /etc/ssh/ssh_config
        regexp: '^#?\s*ForwardX11 '
        line: '    ForwardX11 yes'
      #[cite: 4]


- name: Configurar Montagem Automática com Autofs (db, app e cli)
  hosts: db, app, cli
  become: yes
  tasks:
    - name: Instalar Autofs
      apt:
        name: autofs
        state: present
      #[cite: 4]

    - name: Adicionar mapeamento /var no auto.master
      lineinfile:
        path: /etc/auto.master
        line: '/var /etc/auto.nfs --timeout=60'
      notify: Restart Autofs
      #[cite: 4]

    - name: Criar regra auto.nfs para apontar para o servidor arq
      copy:
        dest: /etc/auto.nfs
        content: "nfs -fstype=nfs,rw,sync 192.168.56.135:/dados/nfs"
      notify: Restart Autofs
      #[cite: 4]

  handlers:
    - name: Restart Autofs
      service: name=autofs state=restarted
