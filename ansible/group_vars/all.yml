# Variáveis usadas por todos os playbooks e templates.
# ATENÇÃO: valores abaixo marcados como PLACEHOLDER devem ser trocados
# pelas matrículas reais antes da entrega. É o único lugar a ser editado.

nome1: gabriel
nome2: caio
dominio: gabriel.caio.devops

# Matrículas (usadas na página do Apache)
matricula_gabriel: "35"   # PLACEHOLDER: trocar pela matrícula completa do Gabriel
matricula_caio: "99"      # PLACEHOLDER: trocar pela matrícula completa do Caio

# Final dos IPs 192.168.56.1XX
final_arq: "35"           # últimos 2 dígitos da matrícula do Gabriel (igual ao XX do Vagrantfile)
final_db: "99"            # PLACEHOLDER: últimos 2 dígitos da matrícula do Caio (YY)
final_app: "40"           # PLACEHOLDER: dígitos definidos pelo grupo (XY)

ip_arq: "192.168.56.1{{ final_arq }}"
ip_db: "192.168.56.1{{ final_db }}"
ip_app: "192.168.56.1{{ final_app }}"
