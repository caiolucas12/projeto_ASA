# Variáveis usadas por todos os playbooks e templates.
# É o único lugar (junto com NOME1/NOME2/XX no topo do Vagrantfile) a ser editado.

nome1: gabriel
nome2: caio
dominio: gabriel.caio.devops

# Matrículas (usadas na página do Apache)
matricula_gabriel: "20251380035"
matricula_caio: "20251380034"
# Final dos IPs 192.168.56.1XX
final_arq: "35"           # últimos 2 dígitos da matrícula do Gabriel (igual ao XX do Vagrantfile)
final_db: "34"           # ultimos 2 digitos da matricula do Caio (YY)
final_app: "54"          # XY: ultimo digito do Gabriel (5) + ultimo digito do Caio (4)

ip_arq: "192.168.56.1{{ final_arq }}"
ip_db: "192.168.56.1{{ final_db }}"
ip_app: "192.168.56.1{{ final_app }}"
final_cli: "50"          # cli recebe o 1o IP do pool DHCP (50-100); MAC fixo no Vagrantfile

ip_cli: "192.168.56.{{ final_cli }}"
