# Inventário do Ansible.
# Todas as VMs são acessadas pela porta SSH redirecionada no host (127.0.0.1),
# fixada no Vagrantfile: arq=2201, db=2202, app=2203, cli=2204.
# Assim o Ansible funciona antes mesmo de a rede privada (eth1) das VMs estar configurada.
[arq]
arq ansible_host=127.0.0.1 ansible_port=2201

[db]
db ansible_host=127.0.0.1 ansible_port=2202

[app]
app ansible_host=127.0.0.1 ansible_port=2203

[cli]
cli ansible_host=127.0.0.1 ansible_port=2204

[all:vars]
ansible_user=vagrant
ansible_ssh_private_key_file=~/.vagrant.d/insecure_private_key
ansible_python_interpreter=/usr/bin/python3
# VMs recriadas mudam a chave de host: não usar known_hosts evita "HOST IDENTIFICATION HAS CHANGED"
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
