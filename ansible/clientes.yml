# Executa por último: depende do DHCP, do DNS (bind9) e do NFS já configurados no arq.
# Rede (eth1 por DHCP), DNS do arq e montagem automática do NFS (autofs) em db, app e cli.
- name: Configurar rede, DNS e autofs (db, app e cli)
  hosts: db, app, cli
  become: yes
  tasks:
    # A box não configura a eth1 (rede privada): ela pede IP ao DHCP do arq.
    # metric alta para o gateway da rede privada não tomar a rota padrão da NAT.
    - name: Configurar eth1 via DHCP
      copy:
        dest: /etc/network/interfaces.d/eth1
        content: |
          auto eth1
          iface eth1 inet dhcp
              metric 1000
      register: eth1

    - name: Subir eth1
      shell: ifdown eth1 || true; ifup eth1
      when: eth1.changed

    # O dhclient sobrescreve o resolv.conf; estas linhas fixam o DNS do arq.
    - name: Fixar DNS e domínio de busca no dhclient
      blockinfile:
        path: /etc/dhcp/dhclient.conf
        block: |
          supersede domain-name-servers {{ ip_arq }};
          supersede domain-search "{{ dominio }}";

    - name: Escrever resolv.conf com o DNS do arq
      copy:
        dest: /etc/resolv.conf
        content: |
          search {{ dominio }}
          nameserver {{ ip_arq }}

    - name: Instalar autofs
      apt:
        name: autofs
        state: present

    - name: Criar diretório /var/nfs
      file:
        path: /var/nfs
        state: directory

    # Mapa direto: só o /var/nfs é montado, o resto do /var não é afetado.
    - name: Adicionar mapa direto no auto.master
      lineinfile:
        path: /etc/auto.master
        line: '/- /etc/auto.nfs'
      notify: Restart Autofs

    - name: Criar regra auto.nfs para apontar para o servidor arq
      copy:
        dest: /etc/auto.nfs
        content: "/var/nfs -fstype=nfs,rw arq.{{ dominio }}:/dados/nfs\n"
      notify: Restart Autofs

  handlers:
    - name: Restart Autofs
      service: name=autofs state=restarted
