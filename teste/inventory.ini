# Inventario de teste: roda o ansible DENTRO da VM arq.
# arq = local; db/app/cli = portas SSH redirecionadas do Vagrant no host (10.0.2.2 e o host visto pela VM).
# Confira as portas com: vagrant ssh-config
[arq]
arq ansible_connection=local
[db]
db ansible_host=10.0.2.2 ansible_port=2202
[app]
app ansible_host=10.0.2.2 ansible_port=2203
[cli]
cli ansible_host=10.0.2.2 ansible_port=2204
[all:vars]
ansible_user=vagrant
ansible_ssh_private_key_file=/home/vagrant/.ssh/insecure_key
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_common_args=-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
